openapi: 3.1.0
info:
  title: Futures API
  description: External API Documentation
  version: v1
servers:
- url: https://api.btse.com/futures/api
  description: Production
security:
- APIKey: []
  Nonce: []
  Signature: []
paths:
  /v3/trade/orders:
    get:
      tags:
      - Trade V3
      summary: Get orders
      description: Returns open orders. When orderId or clOrderId is provided, returns
        that single order; otherwise returns the caller's open orders, optionally
        filtered by symbol.
      operationId: getOrders
      parameters:
      - name: orderId
        in: query
        description: Server-assigned order id to look up a single order.
        required: false
        schema:
          type: string
          description: Server-assigned order id to look up a single order.
      - name: clOrderId
        in: query
        description: Client-assigned order id to look up a single order.
        required: false
        schema:
          type: string
          description: Client-assigned order id to look up a single order.
      - name: symbol
        in: query
        description: Trading pair symbol to filter open orders. Ignored when orderId
          or clOrderId is provided.
        required: false
        schema:
          type: string
          description: Trading pair symbol to filter open orders. Ignored when orderId
            or clOrderId is provided.
        examples:
          default:
            value: BTC-PERP
      - name: includeCancelled
        in: query
        description: If true, cancelled orders are included in the result. Only honored
          when looking up by orderId or clOrderId.
        required: false
        schema:
          type: boolean
          default: false
          description: If true, cancelled orders are included in the result. Only
            honored when looking up by orderId or clOrderId.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResp'
              examples:
                default:
                  value:
                  - orderId: 0251ea47-88b5-48c0-aeb3-b38774fd1f90
                    clOrderId: ''
                    symbol: BTC-PERP
                    orderSide: BUY
                    type: 76
                    orderPrice: 56439.4
                    originalOrderSize: 1
                    currentOrderSize: 1
                    totalFilledSize: 0
                    remainingSize: 1
                    averageFillPrice: 0
                    orderState: STATUS_ACTIVE
                    timestamp: 1784882344358
                    reduceOnly: false
                    positionMode: ONE_WAY
                    positionDirection: null
                    positionId: BTC-PERP-USDT
                    closeOrder: false
                    pegPriceMin: 0
                    pegPriceMax: 0
                    pegPriceDeviation: 1
                    currentPegPrice: 56439.4
                    triggerOrder: false
                    triggered: false
                    triggerPrice: 0
                    triggerOriginalPrice: 0
                    triggerOrderType: 0
                    triggerTrailingStopDeviation: 0
                    triggerStopPrice: 0
                    triggerUseLastPrice: false
                    trailValue: 0
                    trailValueType: DISTANCE
                    activationPrice: null
                    activationPriceType: null
                    takeProfitOrder: null
                    stopLossOrder: null
                    cancelDuration: 0
                    timeInForce: GTC
                    stealth: 1
                    contractSize: 1.0e-05
                    wrapperOrder: false
                    ocoPeerOrderId: null
                    orderDetailType: null
                    originalOrderValue: 0.564394
                    currentOrderValue: 0.564394
    put:
      tags:
      - Trade V3
      summary: Amend an order
      description: Amends an existing order's price, size, or trigger price. The amendType
        field selects which field(s) are changed and which inputs are required.
      operationId: amendOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendOrderReq'
            examples:
              default:
                value:
                  symbol: BTC-PERP
                  orderId: 0251ea47-88b5-48c0-aeb3-b38774fd1f90
                  amendType: PRICE
                  orderPrice: 56439.4
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmendOrderResp'
              examples:
                default:
                  value:
                  - orderId: 0251ea47-88b5-48c0-aeb3-b38774fd1f90
                    clOrderId: ''
                    symbol: BTC-PERP
                    orderSide: BUY
                    type: 76
                    orderPrice: 56439.4
                    orderSize: 1
                    triggerPrice: 0
                    status: 123
                    timestamp: 1784882344404
    post:
      tags:
      - Trade V3
      summary: Place an order
      description: Places a LIMIT or MARKET order. The orderType field selects the
        request variant and its required fields.
      operationId: placeOrder
      parameters:
      - name: BROKER-ID
        in: header
        description: Optional broker/partner identifier to tag orders placed through them
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/Limit'
              - $ref: '#/components/schemas/Market'
            examples:
              Limit:
                value:
                  symbol: BTC-PERP
                  orderType: LIMIT
                  orderSide: BUY
                  orderSize: 1
                  orderPrice: 57009.5
              Market:
                value:
                  symbol: BTC-PERP
                  orderType: MARKET
                  orderSide: BUY
                  orderSize: 1
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderResp'
              examples:
                Limit:
                  value:
                    status: 2
                    type: 0
                    symbol: BTC-PERP
                    postOnly: false
                    orderSide: BUY
                    orderId: 0251ea47-88b5-48c0-aeb3-b38774fd1f90
                    clOrderID: ''
                    timestamp: 1784882344361
                    price: 57009.5
                    avgFilledPrice: 0
                    message: null
                    originalOrderSize: 1
                    currentOrderSize: 1
                    filledSize: 0
                    totalFilledSize: 0
                    remainingSize: 1
                    positionMode: ONE_WAY
                    positionDirection: null
                    positionId: BTC-PERP-USDT
                    timeInForce: GTC
                Market:
                  value:
                    status: 4
                    type: 0
                    symbol: BTC-PERP
                    postOnly: false
                    orderSide: BUY
                    orderId: 8ad94105-8cce-4e01-86b8-2d0fb403db66
                    clOrderID: ''
                    timestamp: 1784882344446
                    price: 60010
                    avgFilledPrice: 60010
                    message: null
                    originalOrderSize: 1
                    currentOrderSize: 1
                    filledSize: 1
                    totalFilledSize: 1
                    remainingSize: 0
                    positionMode: ONE_WAY
                    positionDirection: null
                    positionId: BTC-PERP-USDT
                    timeInForce: GTC
    delete:
      tags:
      - Trade V3
      summary: Cancel an order
      description: Cancels a single order identified by orderId or clOrderId for the
        given symbol.
      operationId: cancelOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderReq'
            examples:
              default:
                value:
                  symbol: BTC-PERP
                  orderId: 0251ea47-88b5-48c0-aeb3-b38774fd1f90
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CancelOrderResp'
              examples:
                default:
                  value:
                  - orderId: 0251ea47-88b5-48c0-aeb3-b38774fd1f90
                    clOrderId: ''
                    symbol: BTC-PERP
                    orderSide: BUY
                    type: 76
                    orderPrice: 0
                    orderSize: 1
                    filledSize: 0
                    status: 6
                    timestamp: 1784882345126
  /v3/trade/settle_in:
    post:
      tags:
      - Trade V3
      summary: Change settlement currency
      description: Switches the collateral (settlement) currency of the caller's position
        on the given symbol.
      operationId: settleIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleInReq'
            examples:
              default:
                value:
                  symbol: BTC-PERP
                  positionId: BTC-PERP-USDT
                  currency: USD
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleInResp'
              examples:
                default:
                  value:
                    symbol: BTC-PERP
                    timestamp: 1784882345085
                    status: 20
                    type: 96
  /v3/trade/risk_limit:
    get:
      tags:
      - Trade V3
      summary: Get risk limit
      description: Returns the currently configured risk-limit tier for the given
        market.
      operationId: getRiskLimit
      parameters:
      - name: symbol
        in: query
        description: Market symbol to query (e.g. BTC-PERP).
        required: true
        schema:
          type: string
          description: Market symbol to query (e.g. BTC-PERP).
        examples:
          default:
            value: BTC-PERP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRiskLimitResp'
              examples:
                default:
                  value:
                    symbol: BTC-PERP
                    riskLimit: 3000000
                    riskLimitLevel: 1
    post:
      tags:
      - Trade V3
      summary: Change risk limit
      description: Updates the risk-limit tier for a market by either notional value
        (riskLimit) or tier index (riskLimitLevel).
      operationId: changeRiskLimit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRiskLimitReq'
            examples:
              default:
                value:
                  symbol: BTC-PERP
                  riskLimitLevel: 1
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRiskLimitResp'
              examples:
                default:
                  value:
                    symbol: BTC-PERP
                    timestamp: 1784882344227
                    status: 20
                    type: 94
                    message: 'New risk limit set to 1. Initial Margin: 0.01, Maintenance
                      Margin: 0.005'
  /v3/trade/positions/tpsl:
    post:
      tags:
      - Trade V3
      summary: Bind take-profit / stop-loss to a position
      description: Attaches a take-profit and/or stop-loss trigger order to an existing
        position; at least one of takeProfitTriggerPrice or stopLossTriggerPrice must
        be provided.
      operationId: bindPositionTpSl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindPositionTpSlReq'
            examples:
              default:
                value:
                  symbol: BTC-PERP
                  orderSide: SELL
                  positionId: BTC-PERP-USDT
                  takeProfitTriggerType: MARK_PRICE
                  takeProfitTriggerPrice: 63010.5
                  stopLossTriggerType: MARK_PRICE
                  stopLossTriggerPrice: 57009.5
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BindPositionTpSlResp'
              examples:
                default:
                  value:
                  - symbol: BTC-PERP
                    status: 9
                    type: 0
                    orderId: bf02a69f-d735-437c-bc59-4759dc850c2b
                    clOrderId: ''
                    triggerPrice: 0
                    positionMode: ONE_WAY
                    positionDirection: null
                    positionId: BTC-PERP-USDT
                    timestamp: 1784882344606
                    message: null
  /v3/trade/position_mode:
    get:
      tags:
      - Trade V3
      summary: Get position mode
      description: Returns the current position mode per market, optionally filtered
        by symbol.
      operationId: getPositionMode
      parameters:
      - name: symbol
        in: query
        description: Optional market symbol filter (e.g. BTC-PERP). Omit to return
          position modes for all symbols.
        required: false
        schema:
          type: string
          description: Optional market symbol filter (e.g. BTC-PERP). Omit to return
            position modes for all symbols.
        examples:
          default:
            value: BTC-PERP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionModeResp'
              examples:
                default:
                  value:
                  - symbol: BTC-PERP
                    positionMode: ONE_WAY
    post:
      tags:
      - Trade V3
      summary: Change position mode
      description: Switches a market's position mode between ONE_WAY (net position)
        and HEDGE (independent long and short positions).
      operationId: changePositionMode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePositionModeReq'
            examples:
              default:
                value:
                  symbol: BTC-PERP
                  positionMode: ONE_WAY
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePositionModeResp'
              examples:
                default:
                  value:
                    symbol: BTC-PERP
                    timestamp: 1784882344272
                    status: 134
                    type: 129
  /v3/trade/orders/cancel_all_after:
    post:
      tags:
      - Trade V3
      summary: Cancel all after (dead man's switch)
      description: Arms a timer that cancels all of the caller's outstanding orders
        if no follow-up call is received within timeoutMs. Calling again resets the
        timer; sending 0 disarms it.
      operationId: cancelAllAfter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAllAfterReq'
            examples:
              default:
                value:
                  timeoutMs: 86400000
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAllAfterResp'
              examples:
                default:
                  value:
                    success: true
  /v3/trade/orders/algo:
    post:
      tags:
