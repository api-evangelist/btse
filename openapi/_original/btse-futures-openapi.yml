  /v3/trade/leverage:
    get:
      tags:
      - Trade V3
      summary: Get leverage settings
      description: Returns the current leverage configuration for the given symbol,
        or the default leverage when the caller has no position on it.
      operationId: getLeverage
      parameters:
      - name: symbol
        in: query
        description: Trading symbol to look up (e.g., BTC-PERP).
        required: true
        schema:
          type: string
          description: Trading symbol to look up (e.g., BTC-PERP).
        examples:
          default:
            value: BTC-PERP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeverageResp'
              examples:
                default:
                  value:
                  - symbol: BTC-PERP
                    leverage: 10
                    marginMode: ISOLATED
                    positionMode: ONE_WAY
                    positionDirection: null
    post:
      tags:
      - Trade V3
      summary: Set leverage
      description: Updates the leverage, margin mode, and position mode for the given
        symbol.
      operationId: changeLeverage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeLeverageReq'
            examples:
              default:
                value:
                  symbol: BTC-PERP
                  leverage: 10
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeLeverageResp'
              examples:
                default:
                  value:
                    symbol: BTC-PERP
                    timestamp: 1784882344185
                    status: 20
                    type: 93
                    message: 'Leverage changed successfully to isolated mode, leverage:
                      10.0'
  /v3/trade/trade_history:
    get:
      tags:
      - Trade V3
      summary: Get trade history
      description: Returns the caller's historical fills, with optional filters (symbol,
        time range, cursor, order IDs, client order ID) and pagination.
      operationId: getTradeHistory
      parameters:
      - name: symbol
        in: query
        description: Trading symbol filter (e.g., BTC-PERP). Optional; when omitted,
          fills across all symbols are returned.
        required: false
        schema:
          type: string
          description: Trading symbol filter (e.g., BTC-PERP). Optional; when omitted,
            fills across all symbols are returned.
        examples:
          default:
            value: BTC-PERP
      - name: startTime
        in: query
        description: Return only fills executed at or after this Unix timestamp in
          milliseconds.
        required: false
        schema:
          type: integer
          format: int64
          description: Return only fills executed at or after this Unix timestamp
            in milliseconds.
      - name: endTime
        in: query
        description: Return only fills executed before this Unix timestamp in milliseconds.
          Must be greater than startTime.
        required: false
        schema:
          type: integer
          format: int64
          description: Return only fills executed before this Unix timestamp in milliseconds.
            Must be greater than startTime.
      - name: beforeSerialId
        in: query
        description: 'Pagination cursor: return fills with serial id less than this
          value.'
        required: false
        schema:
          type: integer
          format: int64
          description: 'Pagination cursor: return fills with serial id less than this
            value.'
      - name: afterSerialId
        in: query
        description: 'Pagination cursor: return fills with serial id greater than
          this value.'
        required: false
        schema:
          type: integer
          format: int64
          description: 'Pagination cursor: return fills with serial id greater than
            this value.'
      - name: orderIds
        in: query
        description: Restrict results to fills belonging to these order IDs.
        required: false
        schema:
          type: array
          description: Restrict results to fills belonging to these order IDs.
          items:
            type: string
            description: Restrict results to fills belonging to these order IDs.
      - name: clOrderId
        in: query
        description: Restrict results to fills belonging to this client-assigned order
          ID.
        required: false
        schema:
          type: string
          description: Restrict results to fills belonging to this client-assigned
            order ID.
      - name: count
        in: query
        description: Maximum number of fills per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          description: Maximum number of fills per page.
          maximum: 100
          minimum: 1
      - name: page
        in: query
        description: Page number (1-based).
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          description: Page number (1-based).
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradeHistoryResp'
              examples:
                default:
                  value:
                  - tradeId: 1ad38104-6248-4a45-bc56-5fa9bf7f3868
                    orderId: 8ad94105-8cce-4e01-86b8-2d0fb403db66
                    clOrderId: ''
                    positionId: BTC-PERP-USDT
                    orderSide: BUY
                    type: 77
                    orderDetailType: null
                    price: 0
                    size: 1
                    avgFilledPrice: 60010
                    filledSize: 1
                    triggerPrice: 0
                    contractSize: 1.0e-05
                    base: BTC
                    quote: USDT
                    symbol: BTC-PERP
                    wallet: BTC-PERP Isolated Wallet
                    feeCurrency: USDT
                    feeAmount: 0.00012002
                    realizedPnl: 0
                    total: -0.00012002
                    serialId: 375598162
                    timestamp: 1784882344446
  /v3/trade/positions:
    get:
      tags:
      - Trade V3
      summary: Get open positions
      description: Returns the caller's open futures positions, optionally filtered
        by market symbol.
      operationId: getPositions
      parameters:
      - name: symbol
        in: query
        description: Optional market symbol filter (e.g. BTC-PERP). Omit to return
          all open positions.
        required: false
        schema:
          type: string
