      operationId: getPositionMode
      summary: Query Position Mode
      description: Returns the current position mode for each market.
      tags:
      - Trade
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        description: Market symbol
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionMode'
              example:
              - symbol: BTC-PERP
                positionMode: ONE_WAY
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    post:
      operationId: changePositionMode
      summary: Change Position Mode
      description: Changes the position mode for the specified market.
      tags:
      - Trade
      security:
      - api: []
        nonce: []
        sign: []
      requestBody:
        required: true
