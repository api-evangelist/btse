  /api/v3.3/order/cancelAllAfter:
    post:
      operationId: postApiV33OrderCancelAllAfter
      summary: Dead Man's Switch (Cancel All After)
      x-doc-slug: dead-mans-switch-cancel-all-after
      x-auth: trading
      x-rate-limit: orders
      description: 'A dead-man''s switch that cancels all open orders if the server does not receive a renewal request within the specified timeout. Used to protect against connection loss.


        Send another `cancelAllAfter` request before the timeout expires to extend it.'
      tags:
      - Trade
      security:
      - api: []
        nonce: []
        sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - timeout
              properties:
                timeout:
                  type: integer
                  description: TTL in milliseconds. When reached, all open orders are cancelled
            example:
              timeout: 60000
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
