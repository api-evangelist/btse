  /api/v3.3/order:
    post:
      operationId: postApiV33Order
      summary: Create New Order
      x-doc-slug: create-new-order
      x-auth: trading
      x-rate-limit: orders
      description: 'Creates a new order. Index Orders only support USD quotes.


        > **Tip:** Use `clOrderID` to track orders with your own identifier. This ID is returned in all order-related responses and WebSocket notifications.


        Supports order types: **LIMIT**, **MARKET**, **OCO**, **PEG** (algo).

        For trigger orders, set `txType` to `STOP` or `TRIGGER` and provide `triggerPrice`.


        ### Price by Order Type {#price-by-order-type}


        | Order Type | Side | `price` meaning |

        | --- | --- | --- |

        | LIMIT | BUY | Max price (quote currency) willing to pay per unit |

        | LIMIT | SELL | Min price (quote currency) willing to accept per unit |

        | MARKET | BUY | Max total amount (quote currency) willing to spend |

        | MARKET | SELL | Not applicable |

        | TRIGGER LIMIT | BUY | Max price willing to pay |

        | TRIGGER LIMIT | SELL | Min price willing to accept |

        | TRIGGER MARKET | BUY | Max total amount willing to spend |

        | TRAILING STOP MARKET | BUY | Max total amount willing to spend |'
      tags:
      - Trade
      security:
      - api: []
        nonce: []
        sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest_2'
            examples:
              market:
                summary: MARKET order
                value:
                  symbol: BTC-USD
                  size: 1
                  side: BUY
                  type: MARKET
              limit:
                summary: LIMIT order
                value:
                  symbol: BTC-USD
                  size: 1
                  price: 34000
                  side: BUY
                  type: LIMIT
              oco:
                summary: OCO order
                value:
                  symbol: BTC-USD
                  size: 1
                  price: 24000
                  side: BUY
                  type: OCO
                  txType: LIMIT
                  stopPrice: 40010
                  triggerPrice: 40000
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
              example:
              - status: 2
                symbol: BTC-USD
                orderType: 76
                price: 34000.0
                side: BUY
                orderID: 990db9b6-2ed4-4c68-b46e-827c88cc3884
                timestamp: 1660208800123
                triggerPrice: 0.0
                stopPrice: null
                trigger: false
                averageFillPrice: 0.0
                clOrderID: null
                postOnly: false
                time_in_force: GTC
                orderCurrency: base
                originalOrderBaseSize: 1.0
                originalOrderQuoteSize: 34000.0
                currentOrderBaseSize: 1.0
                currentOrderQuoteSize: 34000.0
                remainingOrderBaseSize: 1.0
                remainingOrderQuoteSize: 34000.0
                filledBaseSize: 0.0
                totalFilledBaseSize: 0.0
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
      x-operation-id-source: normalized
      x-operation-id-original: createOrder
    get:
      operationId: getApiV33Order
      summary: Query Order
      x-doc-slug: query-order
      x-auth: trading
      x-rate-limit: query
      description: Query order detail by `orderID` or `clOrderID`. Only returns open orders and orders cancelled within the last 30 minutes.
