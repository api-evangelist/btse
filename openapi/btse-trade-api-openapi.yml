components:
  schemas:
    PositionModeUpdateResponse:
      type: object
      properties:
        symbol:
          type: string
          description: Market symbol
        status:
          type: integer
          description: '`20`: Success'
        type:
          type: string
          description: '`129` — Futures config mode change'
        timestamp:
          type: integer
          format: int64
          description: Update timestamp
        message:
          type: string
          description: Response message
    PositionMode:
      type: object
      properties:
        symbol:
          type: string
          description: Market symbol
        positionMode:
          type: string
          enum:
          - ONE_WAY
          - HEDGE
          - ISOLATED
          description: '`ONE_WAY` · `HEDGE` · `ISOLATED`'
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: Error status code
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: Internal error code
        message:
          type: string
          description: Human-readable error description
    CreateOrderRequest:
      type: object
      required:
      - symbol
      - size
      - side
      - type
      properties:
        symbol:
          type: string
          description: Market symbol
        size:
          type: integer
          format: int64
          description: Order size in contract units
        side:
          type: string
          enum:
          - BUY
          - SELL
          description: Order side
        type:
          type: string
          enum:
          - LIMIT
          - MARKET
          - OCO
          description: 'Order type: `LIMIT` · `MARKET` · `OCO` (One-Cancels-the-Other)'
        price:
          type: number
          description: Required for LIMIT orders
        time_in_force:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          - HALFMIN
          - FIVEMIN
          - HOUR
          - TWELVEHOUR
          - DAY
          - WEEK
          - MONTH
          description: 'Time in force: `GTC` (Good Till Cancelled) · `IOC` (Immediate Or Cancel) · `FOK` (Fill Or Kill) · `HALFMIN` (30 seconds) · `FIVEMIN` (5 minutes) · `HOUR` (1 hour) · `TWELVEHOUR` (12 hours) · `DAY` (1 day) · `WEEK` (1 week) · `MONTH` (1 month)'
        txType:
          type: string
          enum:
          - LIMIT
          - STOP
          - TRIGGER
          description: 'Transaction type: `LIMIT` (default) · `STOP` (requires `triggerPrice`) · `TRIGGER` (requires `triggerPrice`)'
        stopPrice:
          type: number
          description: Required for OCO orders
        triggerPrice:
          type: number
          description: Required for STOP, TRIGGER, and OCO orders
        trailValue:
          type: number
          description: Trail value. TP/SL not supported when set
        postOnly:
          type: boolean
          description: Post-only order — charged maker fee
        reduceOnly:
          type: boolean
          description: Reduce-only order
        clOrderID:
          type: string
          description: Custom order ID
        trigger:
          type: string
          enum:
          - markPrice
          - lastPrice
          description: 'Trigger type for STOP/TRIGGER: `markPrice` (default) or `lastPrice`'
        takeProfitPrice:
          type: number
          description: Take profit trigger price
        takeProfitTrigger:
          type: string
          enum:
          - markPrice
          - lastPrice
          description: 'Take profit trigger type: `markPrice` (default) or `lastPrice`'
        stopLossPrice:
          type: number
          description: Stop loss trigger price
        stopLossTrigger:
          type: string
          enum:
          - markPrice
          - lastPrice
          description: 'Stop loss trigger type: `markPrice` (default) or `lastPrice`'
        positionMode:
          type: string
          enum:
          - ONE_WAY
          - HEDGE
          - ISOLATED
          description: 'Position mode: `ONE_WAY` (default) · `HEDGE` · `ISOLATED`'
    MarginSetting:
      type: object
      properties:
        symbol:
          type: string
          description: Market symbol
        initialMarginPercentage:
          type: number
          description: Current initial margin percentage
        maintenanceMarginPercentage:
          type: number
          description: Current maintenance margin percentage
    RiskLimitStatus:
      type: object
      properties:
        symbol:
          type: string
          description: Market symbol
        riskLimit:
          type: integer
          format: int64
          description: Risk limit value in notional
        riskLimitLevel:
          type: integer
          description: Current risk limit tier
    RateLimitError:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code (429)
        message:
          type: string
          description: Rate limit exceeded message
    RiskLimitUpdateResponse:
      type: object
      properties:
        symbol:
          type: string
          description: Market symbol
        status:
          type: integer
          description: '`8`: Insufficient balance · `12`: Error · `20`: Success · `41`: Invalid risk limit'
        type:
          type: number
          description: '`94` — indicates risk limit update'
        timestamp:
          type: integer
          format: int64
          description: Update timestamp
        message:
          type: string
          description: Response message
    AmendOrderRequest:
      type: object
      required:
      - symbol
      - type
      properties:
        symbol:
          type: string
          description: Market symbol
        orderID:
          type: string
          description: Internal order ID. Required if `clOrderID` is not provided. Takes precedence over `clOrderID` if both are provided
        clOrderID:
          type: string
          description: Custom order ID. Required if `orderID` is not provided
        type:
          type: string
          enum:
          - PRICE
          - SIZE
          - TRIGGERPRICE
          - ALL
          description: 'Amendment type: `PRICE` (amend price, use `value`) · `SIZE` (amend size, use `value`) · `TRIGGERPRICE` (amend trigger price, use `value`) · `ALL` (amend multiple fields, use `orderPrice`/`orderSize`/`triggerPrice`)'
        value:
          type: number
          description: New value. Required for `PRICE`, `SIZE`, or `TRIGGERPRICE` amendment types
        orderPrice:
          type: number
          description: New order price. Used when `type` is `ALL`
        orderSize:
          type: integer
          description: New order size in contract units. Used when `type` is `ALL`
        triggerPrice:
          type: number
          description: New trigger price (trigger orders only). Used when `type` is `ALL`
    OpenOrderResponse:
      type: object
      properties:
        symbol:
          type: string
          description: Market symbol
        orderID:
          type: string
          description: Order ID
        clOrderID:
          type: string
          description: Custom order ID
        orderType:
          type: integer
          description: '`76`: Limit · `77`: Market · `80`: Algo'
        side:
          type: string
          description: Trade side
        price:
          type: number
          description: Order price
        orderValue:
          type: number
          description: Notional value
        originalOrderSize:
          type: integer
          description: Original quantity
        currentOrderSize:
          type: integer
          description: Latest quantity
        totalFilledSize:
          type: integer
          description: Cumulative filled
        remainingSize:
          type: integer
          description: Remaining quantity
        timestamp:
          type: integer
          format: int64
          description: Order timestamp
        timeInForce:
          type: string
          description: Order validity
        triggerOrder:
          type: boolean
          description: Whether trigger order
        triggered:
          type: boolean
          description: Whether triggered
        triggerPrice:
          type: number
          description: Trigger price
        reduceOnly:
          type: boolean
          description: Whether reduce-only
        avgFilledPrice:
          type: number
          description: Average filled price
        orderState:
          type: string
          enum:
          - STATUS_ACTIVE
          - STATUS_INACTIVE
          description: Order state
        takeProfitOrder:
          type: object
          description: Take profit order info
        stopLossOrder:
          type: object
          description: Stop loss order info
        closeOrder:
          type: boolean
          description: Whether closes a position
        positionMode:
          type: string
          description: '`ONE_WAY` · `HEDGE` · `ISOLATED`'
        positionDirection:
          type: string
          description: 'Position direction: `LONG` · `SHORT` (only present in HEDGE/ISOLATED mode)'
