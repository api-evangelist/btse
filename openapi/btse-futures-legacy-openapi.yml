            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/v2.3/order/cancelAllAfter:
    post:
      operationId: cancelAllAfter
      summary: Dead Man's Switch (Cancel All After)
      description: |
        Sets a TTL (time-to-live) for all open orders. If the server does not receive a new
        `cancelAllAfter` request before the timeout, all orders are cancelled.
        Extend by sending another request.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeout]
              properties:
                timeout:
                  type: integer
                  format: int64
                  description: TTL in milliseconds
            example:
              timeout: 60000
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/v2.3/order/close_position:
    post:
      operationId: closePosition
      summary: Close Position
      description: |
        Closes a position at market or limit price.

        > **Note:** When using `positionMode: HEDGE` or `ISOLATED`, the `positionId` parameter is required.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosePositionRequest'
      responses:
        '200':
          description: Same fields as Create New Order response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuturesOrderResponse'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
