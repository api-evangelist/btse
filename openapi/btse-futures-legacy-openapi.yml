# ═════════════════════════════════════════════════════════════════════════
# Components
# ═════════════════════════════════════════════════════════════════════════

components:
  securitySchemes:
    api:
      type: apiKey
      in: header
      name: request-api
      description: API key
    nonce:
      type: apiKey
      in: header
      name: request-nonce
      description: Current timestamp in milliseconds
    sign:
      type: apiKey
      in: header
      name: request-sign
      description: "`HMAC-SHA384(secret, path + nonce + body)`"

  schemas:
    # ─── Trade ─────────────────────────────────────────────────────────────

    CreateOrderRequest:
      type: object
      required: [symbol, size, side, type]
      properties:
        symbol:             { type: string,  description: Market symbol }
        size:               { type: integer, format: int64, description: Order size in contract units }
        side:               { type: string,  enum: [BUY, SELL], description: Order side }
        type:               { type: string,  enum: [LIMIT, MARKET, OCO], description: "Order type: `LIMIT` · `MARKET` · `OCO` (One-Cancels-the-Other)" }
        price:              { type: number,  description: Required for LIMIT orders }
        time_in_force:      { type: string,  enum: [GTC, IOC, FOK, HALFMIN, FIVEMIN, HOUR, TWELVEHOUR, DAY, WEEK, MONTH], description: "Time in force: `GTC` (Good Till Cancelled) · `IOC` (Immediate Or Cancel) · `FOK` (Fill Or Kill) · `HALFMIN` (30 seconds) · `FIVEMIN` (5 minutes) · `HOUR` (1 hour) · `TWELVEHOUR` (12 hours) · `DAY` (1 day) · `WEEK` (1 week) · `MONTH` (1 month)" }
        txType:             { type: string,  enum: [LIMIT, STOP, TRIGGER], description: "Transaction type: `LIMIT` (default) · `STOP` (requires `triggerPrice`) · `TRIGGER` (requires `triggerPrice`)" }
        stopPrice:          { type: number,  description: Required for OCO orders }
        triggerPrice:       { type: number,  description: "Required for STOP, TRIGGER, and OCO orders" }
        trailValue:         { type: number,  description: Trail value. TP/SL not supported when set }
        postOnly:           { type: boolean, description: Post-only order — charged maker fee }
        reduceOnly:         { type: boolean, description: Reduce-only order }
        clOrderID:          { type: string,  description: Custom order ID }
        trigger:            { type: string,  enum: [markPrice, lastPrice], description: "Trigger type for STOP/TRIGGER: `markPrice` (default) or `lastPrice`" }
        takeProfitPrice:    { type: number,  description: Take profit trigger price }
        takeProfitTrigger:  { type: string,  enum: [markPrice, lastPrice], description: "Take profit trigger type: `markPrice` (default) or `lastPrice`" }
        stopLossPrice:      { type: number,  description: Stop loss trigger price }
        stopLossTrigger:    { type: string,  enum: [markPrice, lastPrice], description: "Stop loss trigger type: `markPrice` (default) or `lastPrice`" }
        positionMode:       { type: string,  enum: [ONE_WAY, HEDGE, ISOLATED], description: "Position mode: `ONE_WAY` (default) · `HEDGE` · `ISOLATED`" }

    CreateAlgoOrderRequest:
      type: object
      required: [symbol, price, size, side]
      properties:
        symbol:       { type: string,  description: Market symbol }
        price:        { type: number,  description: Min price (sell) or max price (buy) }
        size:         { type: integer, format: int64, description: Order size }
        side:         { type: string,  enum: [BUY, SELL], description: Order side }
        clOrderID:    { type: string,  description: Custom order ID }
        deviation:    { type: number,  description: "Deviation from index price in % (`-10` to `10`)" }
        stealth:      { type: number,  description: Percentage of order to display on orderbook }
        positionMode: { type: string,  enum: [ONE_WAY, HEDGE, ISOLATED], description: "Position mode: `ONE_WAY` (default) · `HEDGE` · `ISOLATED`" }

    AmendOrderRequest:
      type: object
      required: [symbol, type]
      properties:
        symbol:       { type: string,  description: Market symbol }
        orderID:      { type: string,  description: "Internal order ID. Required if `clOrderID` is not provided. Takes precedence over `clOrderID` if both are provided" }
        clOrderID:    { type: string,  description: "Custom order ID. Required if `orderID` is not provided" }
        type:         { type: string,  enum: [PRICE, SIZE, TRIGGERPRICE, ALL], description: "Amendment type: `PRICE` (amend price, use `value`) · `SIZE` (amend size, use `value`) · `TRIGGERPRICE` (amend trigger price, use `value`) · `ALL` (amend multiple fields, use `orderPrice`/`orderSize`/`triggerPrice`)" }
        value:        { type: number,  description: "New value. Required for `PRICE`, `SIZE`, or `TRIGGERPRICE` amendment types" }
        orderPrice:   { type: number,  description: "New order price. Used when `type` is `ALL`" }
        orderSize:    { type: integer, description: "New order size in contract units. Used when `type` is `ALL`" }
        triggerPrice: { type: number,  description: "New trigger price (trigger orders only). Used when `type` is `ALL`" }

    ClosePositionRequest:
      type: object
      required: [symbol, type]
      properties:
        symbol:     { type: string,  description: Market symbol }
        type:       { type: string,  enum: [LIMIT, MARKET], description: "Close type — `LIMIT` requires `price`" }
        price:      { type: number,  description: "Close price. Required for `LIMIT` type" }
        postOnly:   { type: boolean, description: Post-only order }
        positionId: { type: string,  description: "Required when `positionMode` is `HEDGE` or `ISOLATED`" }

    BindTpSlRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol:            { type: string, description: Market symbol }
        side:              { type: string, enum: [BUY, SELL], description: "Required in HEDGE mode — closes the specified position side" }
        takeProfitPrice:   { type: number, description: "Take profit trigger price. At least one of `takeProfitPrice` or `stopLossPrice` must be set" }
        takeProfitTrigger: { type: string, enum: [markPrice, lastPrice], description: "`markPrice` (default) · `lastPrice`" }
        stopLossPrice:     { type: number, description: "Stop loss trigger price. At least one of `takeProfitPrice` or `stopLossPrice` must be set" }
        stopLossTrigger:   { type: string, enum: [markPrice, lastPrice], description: "`markPrice` (default) · `lastPrice`" }
        positionMode:      { type: string, enum: [ONE_WAY, HEDGE, ISOLATED], description: "`ONE_WAY` (default) · `HEDGE` · `ISOLATED`" }
        positionId:        { type: string, description: "Required when `positionMode` is `ISOLATED`" }

    SetRiskLimitRequest:
      type: object
      required: [symbol, riskLimitLevel]
      properties:
        symbol:         { type: string,  description: Market symbol }
        riskLimitLevel: { type: integer, description: Risk limit tier to apply }
        positionMode:   { type: string,  description: "Required when `positionMode` is `HEDGE` or `ISOLATED`" }

    SetLeverageRequest:
      type: object
      required: [symbol, leverage]
      properties:
        symbol:       { type: string,  description: Market symbol }
        leverage:     { type: number,  description: "Leverage value. `0` = cross max leverage" }
        marginMode:   { type: string,  enum: [CROSS, ISOLATED], description: "`CROSS` · `ISOLATED` (default)" }
        positionMode: { type: string,  description: "Required when `positionMode` is `HEDGE` or `ISOLATED`" }
        positionId:   { type: string,  description: "Required when `positionMode` is `HEDGE` or `ISOLATED`" }

    SettlementCurrencyRequest:
      type: object
      required: [symbol, currency]
      properties:
        symbol:     { type: string, description: Market symbol }
        currency:   { type: string, description: Settlement currency }
        positionId: { type: string, description: "Required when `positionMode` is `HEDGE` or `ISOLATED`" }

    ChangePositionModeRequest:
      type: object
      required: [symbol, positionMode]
      properties:
        symbol:       { type: string, description: Market symbol }
        positionMode: { type: string, enum: [ONE_WAY, HEDGE, ISOLATED], description: "`ONE_WAY` · `HEDGE` · `ISOLATED`" }

    WalletTransferRequest:
      type: object
      required: [walletSrcType, walletDestType, apiWallets]
      properties:
        walletSrc:     { type: string, description: "Source wallet identifier. Required when `walletSrcType` is `ISOLATED`" }
        walletSrcType: { type: string, enum: [SPOT, CROSS, ISOLATED], description: Source wallet type }
        walletDest:    { type: string, description: "Destination wallet identifier. Required when `walletDestType` is `ISOLATED`" }
        walletDestType: { type: string, enum: [SPOT, CROSS, ISOLATED], description: Destination wallet type }
        apiWallets:    { type: array, items: { $ref: '#/components/schemas/WalletTransferDetail' }, description: Transfer details }

    WalletTransferDetail:
      type: object
      required: [currency, allBalance]
      properties:
        currency:   { type: string,  description: Currency }
        allBalance: { type: boolean, description: "Whether to transfer entire balance. When `true`, `balance` is ignored" }
        balance:    { type: number,  description: "Amount to transfer (e.g. `10`). Required when `allBalance` is `false`" }

    SubAccountTransferRequest:
      type: object
      required: [walletSrcType, walletDestType, fromUser, receiver, apiWallets]
      properties:
        walletSrcType:  { type: string, enum: [SPOT, CROSS, ISOLATED], description: Source wallet type }
        walletSrc:      { type: string, description: "Required when `walletSrcType` is `ISOLATED`" }
        walletDestType: { type: string, enum: [SPOT, CROSS, ISOLATED], description: Destination wallet type }
        walletDest:     { type: string, description: "Required when `walletDestType` is `ISOLATED`" }
        fromUser:       { type: string, description: Source username }
        receiver:       { type: string, description: Receiver username }
        apiWallets:     { type: array, items: { $ref: '#/components/schemas/WalletTransferDetail' }, description: Transfer details }

    FuturesOrderResponse:
      type: object
      properties:
        symbol:             { type: string,  description: Market symbol }
        orderID:            { type: string,  description: Order ID }
        clOrderID:          { type: string,  description: Custom order ID }
        orderType:          { type: integer, description: "`76`: Limit · `77`: Market · `80`: Algo" }
        side:               { type: string,  description: Trade side }
        price:              { type: number,  description: Order price }
        status:             { type: integer, description: "Order status code: `2` (ORDER_INSERTED) · `4` (FULLY_MATCHED) · `5` (PARTIAL_FILL) · `6` (CANCELLED) · `9` (TRIGGER_INSERTED) · `10` (TRIGGER_ACTIVATED) · `15` (REJECTED)" }
        time_in_force:      { type: string,  description: "Time in force: `GTC` · `IOC` · `FOK` · `HALFMIN` · `FIVEMIN` · `HOUR` · `TWELVEHOUR` · `DAY` · `WEEK` · `MONTH`" }
        timestamp:          { type: integer, format: int64, description: Order timestamp }
        trigger:            { type: boolean, description: Whether order is a trigger order }
        triggerPrice:       { type: number,  description: "Trigger price (`0` if not a trigger order)" }
        avgFilledPrice:     { type: number,  description: Average filled price }
        message:            { type: string,  description: Trade message }
        stealth:            { type: number,  description: Algo orders only }
        deviation:          { type: number,  description: Algo orders only }
        remainingSize:      { type: integer, description: Current order size minus filled size }
        originalOrderSize:  { type: integer, description: Original quantity — unchanged after amendments }
        currentOrderSize:   { type: integer, description: Latest quantity (filled + remaining) }
        filledSize:         { type: integer, description: Quantity filled in this update }
        totalFilledSize:    { type: integer, description: Cumulative filled quantity }
        postOnly:           { type: boolean, description: Whether order is post-only }
        positionMode:       { type: string,  description: "`ONE_WAY` · `HEDGE` · `ISOLATED`" }
        positionDirection:  { type: string,  description: "Position direction: `LONG` · `SHORT` (only present in HEDGE/ISOLATED mode)" }
        positionId:         { type: string,  description: Position ID }

    QueryOrderResponse:
      type: object
      properties:
        orderID:                       { type: string,  description: Order ID }
        symbol:                        { type: string,  description: Market symbol }
        orderType:                     { type: integer, description: Order type }
        side:                          { type: string,  description: Trade side }
        price:                         { type: number,  description: Order price }
        orderValue:                    { type: number,  description: Total order value }
        originalOrderSize:             { type: integer, description: Original quantity }
        currentOrderSize:              { type: integer, description: Latest quantity }
        totalFilledSize:               { type: integer, description: Cumulative filled quantity }
        remainingSize:                 { type: integer, description: Remaining quantity }
        pegPriceMin:                   { type: number,  description: Min peg price }
        pegPriceMax:                   { type: number,  description: Max peg price }
        pegPriceDeviation:             { type: number,  description: Deviation from index price (%) }
        timestamp:                     { type: integer, format: int64, description: Order timestamp }
        triggerOrder:                  { type: boolean, description: Whether it is a trigger order }
        triggerPrice:                  { type: number,  description: Trigger price }
        triggerOriginalPrice:          { type: number,  description: Original trigger price }
        triggerOrderType:              { type: integer, description: Trigger order type }
        triggerTrailingStopDeviation:  { type: number,  description: Trailing stop deviation (%) }
        triggerStopPrice:              { type: number,  description: Stop price (Algo only) }
        triggered:                     { type: boolean, description: Whether trigger has fired }
        trailValue:                    { type: number,  description: Trail value }
        clOrderID:                     { type: string,  description: Custom order ID }
        avgFilledPrice:                { type: number,  description: Average filled price }
