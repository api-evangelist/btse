              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/v2.3/order/bind/tpsl:
    post:
      operationId: bindTpSl
      summary: Bind TP/SL
      description: |
        Binds a take profit and/or stop loss to an existing position.
        At least one of `takeProfitPrice` or `stopLossPrice` must be set.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindTpSlRequest'
      responses:
        '200':
          description: Same fields as Create New Order response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuturesOrderResponse'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/v2.3/risk_limit:
    get:
      operationId: getRiskLimit
      summary: Get Risk Limit
      description: Returns the current risk limit for the specified market.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: Market symbol
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskLimitStatus'
              example:
                symbol: BTC-PERP
                riskLimit: 3000000
                riskLimitLevel: 1
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

    post:
      operationId: setRiskLimit
      summary: Set Risk Limit
      description: Updates the risk limit tier for the specified market.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRiskLimitRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskLimitUpdateResponse'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  /api/v2.3/leverage:
    get:
      operationId: getLeverage
      summary: Get Leverage
      description: Returns the current leverage setting for the specified market.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: Market symbol
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeverageStatus'
              example:
                - symbol: BTC-PERP
                  leverage: 100
                  marginMode: CROSS
                  positionDirection: null
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

    post:
      operationId: setLeverage
      summary: Set Leverage
      description: |
        Changes the leverage setting for the specified market.

        > **Warning:** Setting leverage to `0` applies cross-wallet maximum leverage. Reducing leverage on an existing position may trigger liquidation if the margin is insufficient.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLeverageRequest'
      responses:
        '200':
          description: Successful response
          content:
