  /api/v2.3/user/wallet/transfer:
    post:
      operationId: transferFundsBetweenFuturesWallets
      summary: Transfer Funds Between Futures Wallets
      description: |
        Transfers funds between user wallets (e.g. Spot → Cross, Cross → Isolated).

        > **Important:** When transferring to/from an `ISOLATED` wallet, you must specify the full wallet identifier (e.g. `ISOLATED@BTC-PERP-USDT`).
        >
        > **Note:** the source wallet must hold balance in every `currency` listed in `apiWallets` before calling this endpoint.
      tags: [Wallet]
      security:
        - api: []
          nonce: []
          sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletTransferRequest'
            example:
              walletSrc: ''
              walletSrcType: SPOT
              walletDest: ''
              walletDestType: CROSS
              apiWallets:
                - currency: USD
                  allBalance: true
                - currency: BTC
                  allBalance: true
      responses:
        '200':
          description: Same structure as Query Wallet Balance
          content:
            application/json:
              schema:
                type: array
                items:
