  /api/v2.3/user/trade_history:
    get:
      operationId: getUserTradesFills
      summary: Query Trades Fills
      description: |
        Returns the authenticated user's trade history.

        **Time range constraints:**
        - `startTime` + `endTime`: max 7 days
        - `startTime` only: 7 days after start
        - `endTime` only: 7 days before end
        - Neither: 7 days before current time
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: Market symbol
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Start time in milliseconds
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: End time in milliseconds
        - name: beforeSerialId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Pagination for high-volume markets
        - name: afterSerialId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Pagination for high-volume markets
        - name: count
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Number of records
        - name: includeOld
          in: query
          required: false
          schema:
            type: boolean
          description: Include records older than 7 days
        - name: orderID
          in: query
          required: false
          schema:
            type: string
          description: Filter by order ID
        - name: clOrderID
          in: query
          required: false
          schema:
            type: string
          description: Filter by custom order ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuturesUserTrade'
              example:
                []
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

