openapi: 3.0.3
info:
  title: Futures API
  version: 2.3.0
  description: |
    Futures trading REST API for perpetual and time-based contracts.

    **Base URL:** `https://api.btse.com/futures`
    **Testnet:** `https://testapi.btse.io/futures`

    ## Authentication

    Private endpoints require three HTTP headers:
    - `request-api` — your API key
    - `request-nonce` — current timestamp in milliseconds
    - `request-sign` — `HMAC-SHA384(secret, path + nonce + body)`

    See the [Authentication Guide](/authentication) for full details.

    ## Rate Limits

    | Bucket | Limit |
    |--------|-------|
    | Query endpoints | 15 req/s per endpoint · 30 req/s per user |
    | Order endpoints | 75 req/s per endpoint · 75 req/s per user |

    ## Position Modes

    Futures supports three position modes:
    - **ONE_WAY** — single position per symbol (default)
    - **HEDGE** — simultaneous long and short positions
    - **ISOLATED** — isolated margin per position

    > **Tip:** Use `cancelAllAfter` (Dead Man's Switch) to protect against connection loss during active trading.
  contact:
    name: Support
    url: https://support.btse.com

servers:
  - url: https://api.btse.com/futures
    description: Production
  - url: https://testapi.btse.io/futures
    description: Testnet

tags:
  - name: Trade
    description: Requires API key with Trading permission
  - name: Wallet
    description: Requires API key with Read or Transfer permission

paths:
  # ─── Trade Endpoints ───────────────────────────────────────────────────
  # Public market data endpoints (market_summary, ohlcv, price, orderbook,
  # orderbook/L2, funding_history, market/risk_limit) have been migrated to
  # specs/markets-rest.openapi.yaml.

  /api/v2.3/order:
    post:
      operationId: createOrder
      summary: Create New Order
      description: |
        Creates a new order. Supports **MARKET**, **LIMIT**, **OCO**, trigger, and TP/SL orders.

        > **Tip:** Use `clOrderID` to track orders with your own identifier.

        For trigger orders, set `txType` to `STOP` or `TRIGGER` and provide `triggerPrice`.
        Attach take-profit and stop-loss using `takeProfitPrice`/`stopLossPrice` parameters.

        Supports one-way and hedge position modes via `positionMode`.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              market:
                summary: MARKET order
                value:
                  symbol: BTC-PERP
                  size: 10
                  side: BUY
                  type: MARKET
              limit:
                summary: LIMIT order
                value:
                  symbol: BTC-PERP
                  size: 10
                  price: 21000
                  side: BUY
                  type: LIMIT
              limit_stop:
                summary: LIMIT STOP order
                value:
                  symbol: BTC-PERP
                  size: 10
                  price: 21000
                  side: BUY
                  type: LIMIT
                  txType: STOP
                  triggerPrice: 30000
              oco:
                summary: OCO order
                value:
                  symbol: BTC-PERP
                  size: 10
                  price: 21000
                  side: BUY
                  type: OCO
                  txType: LIMIT
                  trigger: markPrice
                  stopPrice: 30010
                  triggerPrice: 30000
              limit_tpsl:
                summary: LIMIT with TP/SL
                value:
                  symbol: BTC-PERP
                  size: 10
                  price: 29000
                  side: BUY
                  type: LIMIT
                  takeProfitPrice: 31000
                  takeProfitTrigger: markPrice
                  stopLossPrice: 27000
                  stopLossTrigger: lastPrice
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuturesOrderResponse'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

    get:
      operationId: getOrder
      summary: Query Order
      description: Queries order details. Cancelled orders are only available for 30 minutes after cancellation.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      parameters:
        - name: orderID
          in: query
          required: false
          schema:
            type: string
          description: Internal order ID. Takes precedence over `clOrderID` if both provided
        - name: clOrderID
          in: query
          required: false
          schema:
            type: string
          description: Custom order ID. Required if `orderID` not provided
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryOrderResponse'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

    put:
      operationId: amendOrder
      summary: Amend Order
      description: |
        Amends an existing order's price, size, or trigger price.
        Does not apply to algo orders. Already-triggered trigger orders cannot have their trigger price amended.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendOrderRequest'
            examples:
              amend_price:
                summary: Amend price
                value:
                  symbol: BTC-PERP
                  orderID: 25248336-66d8-41ff-99fd-83489c4e6029
                  type: PRICE
                  value: 35000
              amend_size:
                summary: Amend size
                value:
                  symbol: BTC-PERP
                  orderID: 689bf733-4879-4e32-8d1f-cb81f63d24d4
                  type: SIZE
                  value: 5
              amend_all:
                summary: Amend multiple fields
                value:
                  symbol: BTC-PERP
                  orderID: cb2785b0-558e-4b30-bf1f-8a8c56174d0c
                  type: ALL
                  orderPrice: 40010
                  orderSize: 5
                  triggerPrice: 40000
      responses:
        '200':
          description: Same fields as Create New Order response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuturesOrderResponse'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

    delete:
      operationId: cancelOrder
      summary: Cancel Order
      description: |
        Cancels pending orders. If neither `orderID` nor `clOrderID` is provided,
        all orders in the market are cancelled. When cancelling by `clOrderID`,
        all orders with that ID are cancelled.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: Market symbol
        - name: orderID
          in: query
          required: false
          schema:
            type: string
          description: Internal order ID to cancel
        - name: clOrderID
          in: query
          required: false
          schema:
            type: string
          description: Custom order ID to cancel
      responses:
        '200':
          description: Same fields as Create New Order response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuturesOrderResponse'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

