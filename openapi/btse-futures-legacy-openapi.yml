      summary: Change Position Mode
      description: Changes the position mode for the specified market.
      tags: [Trade]
      security:
        - api: []
          nonce: []
          sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePositionModeRequest'
      responses:
        '200':
          description: Successful response
          content:
