  /spot/api/v4/trade/trade_history:
    get:
      tags:
      - Trade V4
      summary: Trade history
      description: Return the caller's recent trade executions for a trading pair,
        optionally filtered by time range, count, order ID, or client order ID.
      operationId: getTradeHistory
      parameters:
      - name: symbol
        in: query
        description: Trading pair
        required: true
        schema:
          type: string
          description: Trading pair
        examples:
          default:
            value: BTC-USD
      - name: startTime
        in: query
        description: Only include trades at or after this Unix timestamp in milliseconds
        required: false
        schema:
          type: integer
          format: int64
          description: Only include trades at or after this Unix timestamp in milliseconds
      - name: endTime
        in: query
        description: Only include trades at or before this Unix timestamp in milliseconds
        required: false
        schema:
          type: integer
          format: int64
          description: Only include trades at or before this Unix timestamp in milliseconds
      - name: count
        in: query
        description: Maximum number of trades to return, defaults to 10
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          description: Maximum number of trades to return, defaults to 10
      - name: clOrderId
        in: query
        description: Client-supplied order ID to filter by
        required: false
        schema:
          type: string
          description: Client-supplied order ID to filter by
      - name: orderId
        in: query
        description: Order ID to filter by
        required: false
        schema:
          type: string
          description: Order ID to filter by
      - name: isMatchSymbol
        in: query
        description: If true, match trades by base/quote currency rather than the
          exact symbol string, to also cover alias symbols for the same pair
        required: false
        schema:
          type: boolean
          default: false
          description: If true, match trades by base/quote currency rather than the
            exact symbol string, to also cover alias symbols for the same pair
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradeHistoryResp'
              examples:
                default:
                  value:
                  - serialId: 375599088
