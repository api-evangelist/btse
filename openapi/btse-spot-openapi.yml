              or INDEX_PRICE)
            enum:
            - INDEX_PRICE
            - LAST_PRICE
            - MARK_PRICE
          clOrderId:
            type: string
            description: Client-supplied order identifier, echoed in the response
              (max 64 characters)
          orderSize:
            type: number
            format: double
            description: Order quantity in base currency; required for SELL market
