        properties:
          symbol:
            type: string
            description: Trading pair, e.g. BTC-USDT
          orderType:
            type: string
            description: CONDITIONAL
            enum:
            - LIMIT
            - MARKET
            - PEG
            - OCO
            - TWAP
            - CONDITIONAL
            - TRAILING
          orderSide:
            type: string
            description: BUY or SELL
            enum:
            - BUY
            - SELL
          triggerPrice:
            type: number
            format: double
