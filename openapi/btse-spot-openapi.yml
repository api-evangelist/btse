openapi: 3.1.0
info:
  title: Spot API
  description: External API Documentation
  version: v1
servers:
- url: https://api.btse.com
  description: Production
security:
- APIKey: []
  Nonce: []
  Signature: []
paths:
  /spot/api/v4/trade/orders:
    get:
      tags:
      - Trade V4
      summary: List orders
      description: List the caller's open orders, optionally filtered by symbol, a
        set of order IDs, or a client order ID.
      operationId: getOrders
      parameters:
      - name: symbol
        in: query
        description: Trading pair to filter by
        required: false
        schema:
          type: string
          description: Trading pair to filter by
        examples:
          default:
            value: BTC-USD
      - name: orderIds
        in: query
        description: Order IDs to filter by
        required: false
        schema:
          type: array
          description: Order IDs to filter by
          items:
            type: string
            description: Order IDs to filter by
      - name: clOrderId
        in: query
        description: Client-supplied order ID to filter by
        required: false
        schema:
          type: string
          description: Client-supplied order ID to filter by
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueryOrderResp'
              examples:
                default:
                  value:
                  - requestId: 4268545858604010293
                    orderId: 4eca2eb4-e6ad-4355-ae12-5ce757b105b3
                    clOrderId: null
                    symbol: BTC-USD
                    quote: USD
                    orderState: STATUS_ACTIVE
                    orderType: 76
                    orderSide: BUY
                    orderPrice: 60413.8
                    orderValue: 0.604138
                    timestamp: 1784891308061
                    timeInForce: GTC
                    orderCurrency: base
                    originalOrderBaseSize: 1.0e-05
                    originalOrderQuoteSize: null
                    currentOrderBaseSize: 1.0e-05
                    currentOrderQuoteSize: null
                    remainingOrderBaseSize: 1.0e-05
                    remainingOrderQuoteSize: null
                    totalFilledBaseSize: 0
                    avgFilledPrice: 0
                    orderDetailType: null
                    orderDetail: null
                    triggerOrder: false
                    triggered: false
                    triggerUseLastPrice: false
                    triggerPrice: 0
                    triggerOriginalPrice: 0
                    triggerOrderType: 0
                    triggerStopPrice: 0
                    triggerTrailingStopDeviation: 0
                    trailValue: 0
                    trailValueType: DISTANCE
                    pegPriceMin: 0
                    pegPriceMax: 0
                    pegPriceDeviation: 0
                    currentPegPrice: 60413.8
                    wrapperOrder: false
                    activationPrice: null
                    activationPriceType: null
    put:
      tags:
      - Trade V4
      summary: Amend order
      description: Amend an open order's price, size, and/or trigger price.
      operationId: amendOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendOrderReq'
            examples:
              default:
                value:
                  symbol: BTC-USD
                  orderId: 4eca2eb4-e6ad-4355-ae12-5ce757b105b3
                  orderPrice: 60413.8
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmendOrderResp'
              examples:
                default:
                  value:
                  - orderId: 4eca2eb4-e6ad-4355-ae12-5ce757b105b3
                    clOrderId: ''
                    status: 123
                    market: BTC-USD
                    type: 76
                    orderSide: BUY
                    orderPrice: 60413.8
                    postOnly: false
                    timestamp: 1784891308178
                    orderDetailType: null
                    message: null
                    userQuoteCurrency: USD
                    orderCurrency: base
                    originalOrderBaseSize: 1.0e-05
                    originalOrderQuoteSize: null
                    currentOrderBaseSize: 1.0e-05
                    currentOrderQuoteSize: null
                    remainingOrderBaseSize: 1.0e-05
                    remainingOrderQuoteSize: null
                    filledBaseSize: 0
                    totalFilledBaseSize: 0
                    avgFilledPrice: 0
                    originalPrice: 60413.8
                    time_in_force: GTC
    post:
      tags:
      - Trade V4
      summary: Place order
      description: Places a normal spot order (MARKET or LIMIT) on the given trading
        pair.
      operationId: placeOrder
      parameters:
      - name: BROKER-ID
        in: header
        description: Optional broker/partner identifier to tag orders placed through
          them
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/Limit'
              - $ref: '#/components/schemas/Market'
            examples:
              Limit:
                value:
                  symbol: BTC-USD
                  orderType: LIMIT
                  orderSide: BUY
                  orderSize: 1.0e-05
                  orderPrice: 61024.1
              Market:
                value:
                  symbol: BTC-USD
                  orderType: MARKET
                  orderSide: BUY
                  quoteOrderSize: 1.9
