                    triggerType: 0
                    triggerPrice: 0
                    price: 64235.97008
                    size: 1.9
                    filledSize: 2.0e-05
                    feeCurrency: BTC
                    feeAmount: 1.0e-08
                    timestamp: 1784890959551
