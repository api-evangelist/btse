                    filledBaseSize: 2.0e-05
                    totalFilledBaseSize: 2.0e-05
                    avgFilledPrice: 64235.9701
                    time_in_force: GTC
    delete:
      tags:
      - Trade V4
      summary: Cancel order
      description: Cancel a single open order identified by orderId or clOrderId on
        the given trading pair.
      operationId: cancelOrder
      parameters:
      - name: symbol
        in: query
        description: Trading pair
        required: true
        schema:
          type: string
        examples:
          default:
            value: BTC-USD
      - name: orderId
        in: query
        description: Order ID to cancel; at least one of orderId or clOrderId is required
        required: false
        schema:
          type: string
        examples:
          default:
            value: 4eca2eb4-e6ad-4355-ae12-5ce757b105b3
      - name: clOrderId
        in: query
        description: Client-supplied order ID to cancel; at least one of orderId or
          clOrderId is required
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceOrderResp'
              examples:
                default:
                  value:
                  - orderId: 4eca2eb4-e6ad-4355-ae12-5ce757b105b3
