          triggerOrderType:
            type: string
            description: 'Trigger behavior: STOP_LOSS, TAKE_PROFIT, STOP_LOSS_LIMIT,
              or TAKE_PROFIT_LIMIT'
            enum:
            - STOP_LOSS
            - TAKE_PROFIT
            - STOP_LOSS_LIMIT
            - TAKE_PROFIT_LIMIT
          triggerPriceType:
            type: string
