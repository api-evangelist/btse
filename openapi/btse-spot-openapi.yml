  /spot/api/v4/trade/orders/cancel_all_after:
    post:
      tags:
      - Trade V4
      summary: Cancel all orders after
      description: Arm a dead-man switch that cancels all open orders after the given
        timeout unless another request resets it first.
      operationId: cancelAllAfter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAllAfterReq'
            examples:
              default:
                value:
                  timeout: 86400000
        required: true
      responses:
        '200':
          description: OK
  /spot/api/v4/trade/orders/algo:
