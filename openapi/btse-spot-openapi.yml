  /spot/api/v4/trade/fees:
    get:
      tags:
      - Trade V4
      summary: Get fees
      description: Return the caller's maker and taker fee rates, optionally scoped
        to a single trading pair.
      operationId: getFees
      parameters:
      - name: symbol
        in: query
        description: Trading pair to filter by
        required: false
        schema:
          type: string
          description: Trading pair to filter by
        examples:
          default:
            value: BTC-USD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueryFeesResp'
              examples:
                default:
                  value:
                  - symbol: BTC-USD
                    makerFee: 0.0005
                    takerFee: 0.0006
  /spot/api/v4/trade/orders/all:
    delete:
      tags:
      - Trade V4
      summary: Cancel all orders
      description: Cancel all open orders for the given trading pair. Pass the literal
        value "ALL" as symbol to cancel every open order across all trading pairs.
      operationId: cancelAllOrders
      parameters:
      - name: symbol
        in: query
        description: Trading pair, or "ALL" to cancel every open order across all
          pairs
        required: true
        schema:
          type: string
        examples:
          bySymbol:
            value: BTC-USD
          all:
            value: ALL
      responses:
        '200':
          description: OK
components:
  schemas:
    AmendOrderReq:
      type: object
      description: Amend order
      properties:
        orderId:
          type: string
          description: Order ID identifying the order to amend; at least one of orderId
            or clOrderId is required
        clOrderId:
          type: string
          description: Client-assigned order ID identifying the order to amend; at
            least one of orderId or clOrderId is required
        symbol:
          type: string
          description: Trading pair, e.g. BTC-USDT
        orderPrice:
          type: number
          format: double
          description: New limit price; omit to leave unchanged. At least one of orderPrice,
            orderSize or triggerPrice is required.
        orderSize:
          type: number
          format: double
          description: New order size; omit to leave unchanged. At least one of orderPrice,
            orderSize or triggerPrice is required.
        triggerPrice:
          type: number
          format: double
          description: New trigger price; omit to leave unchanged. At least one of
            orderPrice, orderSize or triggerPrice is required.
        totalAmountMode:
          type: boolean
          description: When true, orderSize is interpreted as the new total order
            quantity (including the already-filled portion); when false (default),
            orderSize is interpreted as the new remaining quantity.
      required:
      - symbol
    AmendOrderResp:
      type: object
      properties:
        orderId:
          type: string
          description: Server-assigned order identifier
        clOrderId:
          type: string
          description: Echo of the client-supplied order identifier if one was provided
        status:
          type: integer
          format: int32
          description: Numeric status code reflecting the current state of the order
            (e.g. filled, cancelled, rejected)
        market:
          type: string
          description: Trading pair, e.g. BTC-USDT
        type:
          type: integer
          format: int32
          description: Numeric code identifying the order type (e.g. LIMIT, MARKET,
            TWAP, PEG)
        orderSide:
          type: string
          description: BUY or SELL
        orderPrice:
          type: number
