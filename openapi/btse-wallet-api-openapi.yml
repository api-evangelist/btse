                data:
                - transactionRef: '2023010100000001'
                  asset: BTC
                  amount: '1'
                  receiverUsername: tester
                  receiverUid: '1234567890'
    servers:
    - url: https://api.btse.com
      description: Production
    - url: https://testapi.btse.io
      description: Testnet
