openapi: 3.2.0
info:
  title: Btse Wallet API
  contact:
    name: Support
    url: https://support.btse.com
  version: '1.0'
  description: 'Operations tagged Wallet across 4 of this provider''s published API definitions: futures-rest.openapi.yaml, wallet-rest.openapi.yaml, btse-futures-legacy-openapi.yml, btse-wallet-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.btse.com/futures
  description: Production
- url: https://testapi.btse.io/futures
  description: Testnet
- url: https://api.btse.com
  description: Production
- url: https://testapi.btse.io
  description: Testnet
tags:
- name: Wallet
  description: Requires API key with Read or Transfer permission
paths:
  /api/v2.3/user/wallet:
    get:
      operationId: getWalletBalance
      summary: Query Wallet Balance
      description: Returns the user's futures wallet balance.
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: wallet
        in: query
        required: false
        schema:
          type: string
        description: Wallet identifier — `CROSS@` or `ISOLATED@{symbol}-USDT` (e.g. `ISOLATED@BTC-PERP-USDT`). Optional — if omitted, returns balances across all wallets.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletBalance'
              example:
              - wallet: CROSS@
                activeWalletName: String
                queryType: 0
                trackingID: 0
                walletTotalValue: 0
                totalValue: 100
                marginBalance: 100
                availableBalance: 100
                unrealisedProfitLoss: 0
                maintenanceMargin: 0
                leverage: 0
                openMargin: 0
                assets:
                - balance: 0.20183537
                  assetPrice: 7158.845
                  currency: BTC
                assetsInUse:
                - balance: 0.01
                  assetPrice: 7158.845
                  currency: BTC
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    servers:
    - url: https://api.btse.com/futures
      description: Production
    - url: https://testapi.btse.io/futures
      description: Testnet
  /api/v2.3/user/wallet_history:
    get:
      operationId: getWalletHistory
      summary: Query Wallet History
      description: Returns wallet transaction history for futures wallets.
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: wallet
        in: query
        required: false
        schema:
          type: string
        description: Wallet identifier (`CROSS@` or `ISOLATED@BTC-PERP-USDT`). Omit to return all wallets
      - name: startTime
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Start time in milliseconds
      - name: endTime
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: End time in milliseconds
      - name: count
        in: query
        required: false
        schema:
          type: integer
        description: Number of records to return
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletHistoryEntry'
              example: []
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    servers:
    - url: https://api.btse.com/futures
      description: Production
    - url: https://testapi.btse.io/futures
      description: Testnet
  /api/v2.3/user/unifiedWallet/margin:
    get:
      operationId: getUnifiedWalletMargin
      summary: Query Unified Wallet Margin
      description: Returns margin information for the upgraded unified wallet. Use this endpoint if you have upgraded to the unified wallet.
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: symbol
        in: query
        required: false
        schema:
          type: string
        description: Market symbol
      - name: positionId
        in: query
        required: false
        schema:
          type: string
        description: Position unique ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedWalletMargin'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    servers:
    - url: https://api.btse.com/futures
      description: Production
    - url: https://testapi.btse.io/futures
      description: Testnet
  /api/v2.3/user/margin:
    get:
      operationId: getWalletMargin
      summary: Query Wallet Margin
      description: 'Returns margin information for the specified wallet.

        **Not available for unified wallet users** — use Query Unified Wallet Margin instead.'
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
        description: Market symbol
      responses:
        '200':
          description: Same structure as Query Wallet Balance with additional `requestId` field
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletBalance'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    servers:
    - url: https://api.btse.com/futures
      description: Production
    - url: https://testapi.btse.io/futures
      description: Testnet
  /api/v2.3/user/wallet/transfer:
    post:
      operationId: transferFundsBetweenFuturesWallets
      summary: Transfer Funds Between Futures Wallets
      description: 'Transfers funds between user wallets (e.g. Spot → Cross, Cross → Isolated).


        > **Important:** When transferring to/from an `ISOLATED` wallet, you must specify the full wallet identifier (e.g. `ISOLATED@BTC-PERP-USDT`).

        >

        > **Note:** the source wallet must hold balance in every `currency` listed in `apiWallets` before calling this endpoint.'
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletTransferRequest'
            example:
              walletSrc: ''
              walletSrcType: SPOT
              walletDest: ''
              walletDestType: CROSS
              apiWallets:
              - currency: USD
                allBalance: true
              - currency: BTC
                allBalance: true
      responses:
        '200':
          description: Same structure as Query Wallet Balance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletBalance'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    servers:
    - url: https://api.btse.com/futures
      description: Production
    - url: https://testapi.btse.io/futures
      description: Testnet
  /api/v2.3/subaccount/wallet/transfer:
    post:
      operationId: subAccountWalletTransfer
      summary: Sub-Account Wallet Transfer
      description: Transfers funds between the main account and a sub-account wallet.
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubAccountTransferRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccountTransferResponse'
        '400':
          description: Bad Request — invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid API key, nonce, or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
    servers:
    - url: https://api.btse.com/futures
      description: Production
    - url: https://testapi.btse.io/futures
      description: Testnet
  /public-api/wallet/v1/assets:
    get:
      operationId: getAssets
      summary: Assets
      description: Get available asset list.
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: asset
        in: query
        required: false
        schema:
          type: string
        description: Asset
        example: BTC
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryAssetsResponse'
              example:
                success: true
                code: 1
                msg: Success
                time: 1624989977940
                data:
                - asset: BTC
                  type: CRYPTO
                  name: Bitcoin
                  precision: 8
                  tradeScale: 5
                - asset: USD
                  type: FIAT
                  name: US Dollar
                  precision: 2
                  tradeScale: 2
    servers:
    - url: https://api.btse.com
      description: Production
    - url: https://testapi.btse.io
      description: Testnet
  /public-api/wallet/v1/crypto/list:
    get:
      operationId: getCryptoList
      summary: Crypto List
      description: Get available crypto token list with corresponding action. Only supports `DEPOSIT` and `WITHDRAW`.
      tags:
      - Wallet
      security: []
      parameters:
      - name: action
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SupportCryptoActionEnum'
        description: Action
        example: DEPOSIT
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoListResponse'
              example:
                success: true
                code: 1
                msg: Success
                time: 1624989977940
                data:
                - BTC
                - ETH
    servers:
    - url: https://api.btse.com
      description: Production
    - url: https://testapi.btse.io
      description: Testnet
  /public-api/wallet/v1/crypto/networks:
    get:
      operationId: getCryptoNetworks
      summary: Crypto Networks
      description: 'Get crypto network list with corresponding crypto.


        This API can be publicly accessed without any security headers to get a default network list.

        If you access with `Read` permission authentication, the result will be much more accurate by account setting.


        The response of `depositEnable` and `withdrawEnable` is true by default under the publicly accessed environment.

        - The total deposit fee is `max(depositFeeMin, (amount × depositFeeRate)) + (depositExtFees + depositExtFeeRate × amount)`.

        - The total withdrawal fee is `max(withdrawFeeMin, (amount × withdrawFeeRate)) + (withdrawExtFees + withdrawExtFeeRate × amount)`.


        **Note: For crypto with small prices, the** Markets Information **API displays them using K/M/B prefixes and process trades with the corresponding quantities. (ex. `K_PEIPEI`) However, Wallet-related APIs display the actual crypto information, so both requests and responses will use the original crypto name. (ex. `PEIPEI`)**'
      tags:
      - Wallet
      security: []
      parameters:
      - name: crypto
        in: query
        required: true
        schema:
          type: string
        description: Crypto currency, such as BTC
        example: BTC
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoNetworksResponse'
              example:
                success: true
                code: 1
                msg: Success
                time: 1624989977940
                data:
                - network: ERC20
                  name: Ethereum (ERC20)
                  depositEnable: true
                  withdrawEnable: true
                  confirmationTime: 15
                  depositAmtMin: '0'
                  depositFeeMin: '0'
                  depositFeeRate: '0'
                  depositExtFees: '0'
                  depositExtFeeRate: '0'
                  needAddressExtension: false
                  withdrawAmtMin: '36.41'
                  withdrawFeeMin: '6.41'
                  withdrawFeeRate: '0'
                  withdrawExtFees: '0'
                  withdrawExtFeeRate: '0'
                - network: RIPPLE
                  name: Ripple
                  depositEnable: true
                  withdrawEnable: true
                  confirmationTime: 10
                  depositAmtMin: '0'
                  depositFeeMin: '0'
                  depositFeeRate: '0'
                  depositExtFees: '0'
                  depositExtFeeRate: '0'
                  needAddressExtension: true
                  addressExtensionTypeName: tag
                  withdrawAmtMin: '0.25'
                  withdrawFeeMin: '20'
                  withdrawFeeRate: '0'
                  withdrawExtFees: '0'
                  withdrawExtFeeRate: '0'
    servers:
    - url: https://api.btse.com
      description: Production
    - url: https://testapi.btse.io
      description: Testnet
  /public-api/wallet/v1/assets/exchangeRate:
    get:
      operationId: getAssetExchangeRate
      summary: Get Asset Exchange Rate
      description: Retrieve exchange rate about a specific pair. For example, `baseCurrency` and `quoteCurrency`.
      tags:
      - Wallet
      security: []
      parameters:
      - name: baseCurrency
        in: query
        required: true
        schema:
          type: string
        description: Base currency, such as BTC
        example: BTC
      - name: amount
        in: query
        required: true
        schema:
          type: string
          example: '2'
        description: The quantity of `baseCurrency`.
      - name: quoteCurrency
        in: query
        required: true
        schema:
          type: string
        description: Quote currency, such as USDT
        example: USDT
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetExchangeRateResponse'
              example:
                success: true
                code: 1
                msg: Success
                time: 1624989977940
                data:
                - rate: '19026.12846161'
    servers:
    - url: https://api.btse.com
      description: Production
    - url: https://testapi.btse.io
      description: Testnet
  /public-api/wallet/v1/user/assets:
    get:
      operationId: getUserAssets
      summary: User Wallet
      description: Get user's assets list and balance. Requires the `Read` permission.
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: asset
        in: query
        required: false
        schema:
          type: string
        description: Asset
        example: BTC
      - name: action
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetActionEnum'
        description: Support action
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryUserAssetsResponse'
              example:
                success: true
                code: 1
                msg: Success
                time: 1624989977940
                data:
                - asset: BTC
                  type: CRYPTO
                  totalAmount: '100.0'
                  availableAmount: '100.0'
                  availableActions:
                  - CONVERT
                  - TRANSFER
                  - WITHDRAW
                  - DEPOSIT
                  - SEND_TO
                  cryptoNetwork:
                    depositNetworks:
                    - BITCOIN
                    - LIQUID
                    withdrawalNetworks:
                    - BITCOIN
                    - LIQUID
                - asset: USDT
                  type: FIAT
                  totalAmount: '25000.0'
                  availableAmount: '19000.0'
                  availableActions:
                  - CONVERT
                  - TRANSFER
                  - WITHDRAW
                  - DEPOSIT
                  - SEND_TO
                  cryptoNetwork:
                    depositNetworks: []
                    withdrawalNetworks: []
    servers:
    - url: https://api.btse.com
      description: Production
    - url: https://testapi.btse.io
      description: Testnet
  /public-api/wallet/v1/user/walletHistory:
    get:
      operationId: getUserWalletHistory
      summary: User Wallet History
      description: 'Query wallet history. Requires the `Read` permission.


        Query parameter rules:

        - It''s **RECOMMENDED** to include `walletType` in the query. If it''s not provided, the default will be to query spot wallet history only.

        - `walletName` is required if `walletType` is `ISOLATED`.

        - Only upgraded wallet allow query wallet history by using `walletType=UNIFIED`.

        - `historyTypes` should be encoded to a json array.

        - It will default to fetch data from the past 7 days if the `startTime` and the `endTime` are not set.

        - The `startTime` and `endTime` must be within the range of the past 120 days.

        - If your futures wallet has already been upgraded, querying future wallet history with `walletType=UNIFIED` for retrieving the post-upgrade history.

        - Querying wallet history by setting `walletType=CROSS` or `walletType=ISOLATED` will only return wallet history from before the futures wallet upgrade.


        For example,

        ```

        // query spot wallet history since 7 days ago.

        .../public-api/wallet/v1/user/walletHistory?walletType=SPOT

        // query spot deposit and withdraw history since 7 days ago.

        .../public-api/wallet/v1/user/walletHistory?walletType=SPOT&historyTypes=["DEPOSIT","WITHDRAW"]

        // query spot deposit and withdraw history from 2023-01-01 to 2023-03-31.

        .../public-api/wallet/v1/user/walletHistory?walletType=SPOT&historyTypes=["DEPOSIT","WITHDRAW"]&startTime=1672531200000&endTime=1680307200000

        // query BTC-PERP isolated wallet history since 7 days ago.

        .../public-api/wallet/v1/user/walletHistory?walletType=ISOLATED&walletName=ISOLATED@BTC-PERP-USDT

        ```

        The detail which is a transaction on the blockchain will show `cryptoNetwork`, and once the transaction is completed, the `txId` will be displayed.'
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: walletType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/WalletTypeEnum'
        example: SPOT
      - name: walletName
        in: query
        required: false
        schema:
          type: string
        example: ISOLATED@BTC-PERP-USDT
        description: The name of isolated wallet. Required when `walletType` is `ISOLATED`
      - name: asset
        in: query
        required: false
        schema:
          type: string
          example: BTC
        description: Asset. Required when `walletType`=`SPOT`.
      - name: historyTypes
        in: query
        required: false
        schema:
          description: It's a string using json array format
          type: array
          items:
            $ref: '#/components/schemas/WalletTransactionTypeEnum'
          example: '["DEPOSIT", "WITHDRAW"]'
        description: Specified query history types
      - name: startTime
        in: query
        required: false
        schema:
          type: number
          example: 1624987283000
        description: Starting time (included).
      - name: endTime
        in: query
        required: false
        schema:
          type: number
          example: 1624987283000
        description: Ending time (excluded).
      - name: pageSize
        in: query
        required: false
        schema:
          type: number
          example: 10
          default: 10
          maximum: 100
        description: Page size for pagination
      - name: currentPage
        in: query
        required: false
        schema:
          type: number
          example: 1
          default: 1
        description: Current page number for pagination
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryWalletHistoryResponse'
              examples:
                Deposit (crypto):
                  value:
                    success: true
                    code: 1
                    msg: Success
                    time: 1624989977940
                    data:
                    - transactionTime: 1678445104907
                      type: DEPOSIT
                      walletName: SPOT@
                      asset: ETH
                      netAmount: '0.05'
                      amount: '0.05'
                      transactionRef: '2023031000000321'
                      status: COMPLETED
                      description: null
                      fee: '0'
                      cryptoNetwork: ETHEREUM
                      toAddress: '0xF14BAc881e719934CEFccD1AC5dC5f814dfbCbF8'
                      confirmTimes: (10/10)
                      txId: '0x94ead563799ee341cb136c18dc9a71a231abaec820caa18c096febbe92da8709'
                Withdraw (crypto):
                  value:
                    success: true
                    code: 1
                    msg: Success
                    time: 1624989977940
                    data:
                    - transactionTime: 1678957494276
                      type: WITHDRAW
                      walletName: SPOT@
                      asset: USDT
                      netAmount: '-30'
                      amount: '-30'
                      transactionRef: '2023031600000374'
                      status: COMPLETED
                      description: null
                      fee: '6.429'
                      cryptoNetwork: ERC20
                      toAddress: '0xF14BAc881e719934CEFccD1AC5dC5f814dfbCbF8'
                      confirmTimes: (15/15)
                      txId: '0x0a8487a85f37d4995716419d7d7d7048c9625fab8cae69c235103a39ea789377'
                Send To:
                  value:
                    success: true
                    code: 1
                    msg: Success
                    time: 1624989977940
                    data:
