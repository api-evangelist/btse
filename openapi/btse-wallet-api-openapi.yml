                      cryptoNetwork: null
                      confirmTimes: null
                      txId: null
                Others:
                  value:
                    success: true
                    code: 1
                    msg: Success
                    time: 1767580139575
                    data:
                    - transactionTime: 1767580126422
                      type: TRANSFER_OUT
                      walletName: VIRTUAL|4@BTCPFC-USDT#1
                      asset: USDT
                      netAmount: '-1.00950715'
                      amount: '-1.00950715'
                      transactionRef: e6d252e8-eb64-48cd-81f0-e35ab453059d
