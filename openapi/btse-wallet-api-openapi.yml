  /public-api/wallet/v1/user/crypto/address:
    get:
      operationId: getAddress
      summary: Query Address
      description: Query latest 10 active addresses. Requires the `Wallet` permission.
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: crypto
        in: query
        required: true
        schema:
          type: string
          example: USDT
        description: Crypto currency
      - name: network
        in: query
        required: true
        schema:
          type: string
          example: ERC20
        description: Crypto network
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryAddressResponse'
              examples:
                Common:
                  value:
                    success: true
                    code: 1
                    msg: Success
                    time: 1678700285000
                    data:
                    - address: '0xc48fd69d0f4B521B7200345A67641aB4076828f2'
                      addressExtensionTypeName: null
                      addressExtension: null
                      createTime: 1678070826000
                Has Extension:
                  value:
                    success: true
                    code: 1
                    msg: Success
                    time: 1678700285000
                    data:
                    - address: rHJhVRJGWGDqVX6cX8Ca1nPZMrkARE2VVx
                      addressExtensionTypeName: tag
                      addressExtension: '533973779'
                      createTime: 1678070826000
    post:
      operationId: createAddress
      summary: Create Address
      description: 'Create address. Requires the `Wallet` permission.


        In the `Query address` API, you can retrieve the latest 10 active addresses that can be used for a specific crypto and network.

        If the number of addresses reaches 10, and none of these addresses were used for deposits, the service will restrict the creation of new addresses by returning a HTTP status code `400`.

        If you encounter this situation, use the existing addresses for deposits, then you''ll be able to continue creating new addresses after.'
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
            examples:
              USDT-ERC20:
                value:
                  crypto: USDT
                  network: ERC20
              USDT-ERC20-Webhook:
                value:
                  crypto: USDT
                  network: ERC20
                  webhookUrl: '{URL for webhook}'
              XRP-RIPPLE:
                value:
                  crypto: XRP
                  network: RIPPLE
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAddressResponse'
              examples:
                Common:
                  value:
                    success: true
                    code: 1
                    msg: Success
                    time: 1678070826000
                    data:
                    - address: '0xc48fd69d0f4B521B7200345A67641aB4076828f2'
                      addressExtensionTypeName: null
                      addressExtension: null
                      createTime: 1678070826000
                Has Extension:
                  value:
                    success: true
                    code: 1
                    msg: Success
                    time: 1678070826000
                    data:
                    - address: rHJhVRJGWGDqVX6cX8Ca1nPZMrkARE2VVx
                      addressExtensionTypeName: tag
                      addressExtension: '533973779'
                      createTime: 1678070826000
        '400':
          description: Request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
              examples:
                Reach Address Creation Limit:
                  description: Reach Address Creation Limit
                  value:
                    success: false
                    code: 11080001
                    msg: crypto address full
                    time: 1662542807278
    delete:
      operationId: deleteAddress
      summary: Delete Address
      description: 'Rate Limit: 10 requests per 1 day based on IP.

        Delete a crypto address. Requires the `Wallet` permission.'
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      parameters:
      - name: crypto
        in: query
        required: true
        schema:
          type: string
          example: USDT
        description: Cryptocurrency
      - name: network
        in: query
        required: true
        schema:
          type: string
          example: ERC20
        description: Crypto network
      - name: address
        in: query
        required: true
        schema:
          type: string
          example: '0xc48fd69d0f4B521B7200345A67641aB4076828f2'
        description: Crypto address
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
              example:
                success: true
                code: 1
                msg: Success
                time: 1624989977940
                data:
                - result: OK
    servers:
    - url: https://api.btse.com
      description: Production
    - url: https://testapi.btse.io
      description: Testnet
  /public-api/wallet/v1/user/crypto/withdraw:
    post:
      operationId: withdraw
      summary: Withdraw
      description: 'Withdraw. Requires the `Withdraw` permission. Please refer to the Crypto Networks endpoint for fee calculation.


        The parameter `amountIncludeFee` affects how the fee is handled, with the differences as follows:

        - `amountIncludeFee` = true

        - `amount` is the amount to be deducted from user''s wallet (i.e., including fee). The amount the user receives will be `amount - fee`.

        - `amountIncludeFee` = false

        - `amount` is the amount the user wants to receive (i.e., excluding fee). The amount deducted from user''s wallet will be `amount + fee`.'
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
        sign: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
            examples:
              Common:
                value:
                  crypto: USDT
                  network: ERC20
                  address: '0xc48fd69d0f4B521B7200345A67641aB4076828f2'
                  amount: '36'
              Has Extension:
                value:
                  crypto: XRP
                  network: RIPPLE
                  address: rHJhVRJGWGDqVX6cX8Ca1nPZMrkARE2VVx
                  addressExtension: '533973779'
                  amount: '20'
              Has Webhook URL:
                value:
                  crypto: USDT
                  network: ERC20
                  address: '0xc48fd69d0f4B521B7200345A67641aB4076828f2'
                  amount: '36'
                  webhookUrl: '{URL for webhook}'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawResponse'
              example:
                success: true
                code: 1
                msg: Success
                time: 1624989977940
                data:
                - transactionRef: '2025060500001'
                  orderId: cca02a29-e47c-4ee7-9d42-28b850a843ec
                  crypto: USDT
                  network: ERC20
                  address: '0xc48fd69d0f4B521B7200345A67641aB4076828f2'
                  addressExtension: null
                  amountToAddress: '30.45'
                  fees: '5.55'
    servers:
    - url: https://api.btse.com
      description: Production
    - url: https://testapi.btse.io
      description: Testnet
  /public-api/wallet/v1/user/assets/sendTo:
    post:
      operationId: sendTo
      summary: Send To (transfer to user)
      description: 'Transfer to another user. Requires the `Transfer` permission.

        Invoke the API with either the `receiverUsername` or the `receiverUid` parameter.'
      tags:
      - Wallet
      security:
      - api: []
        nonce: []
